<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cili-server 管理端</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e4e7ec; --text:#1f2937; --muted:#667085; --accent:#2563eb; --danger:#dc2626; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif; }
  button, input, select, textarea { font:inherit; }
  button { cursor:pointer; }
  .login-wrap { min-height:100vh; display:grid; place-items:center; padding:24px; }
  .login-card { width:340px; max-width:100%; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:24px; box-shadow:0 10px 30px rgba(16,24,40,.08); }
  .login-card h1 { font-size:18px; margin:0 0 16px; }
  .field { display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .field label { font-size:12px; color:var(--muted); }
  .field input, .field select, .field textarea { width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .field textarea { min-height:90px; resize:vertical; font-family:ui-monospace,Consolas,monospace; font-size:12px; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:7px 11px; }
  .btn.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  .btn.danger { color:var(--danger); }
  .btn.small { padding:4px 8px; font-size:12px; }
  .muted { color:var(--muted); }
  .error { color:var(--danger); font-size:12px; min-height:18px; }
  .app { min-height:100vh; display:grid; grid-template-rows:auto auto 1fr; }
  .topbar { display:flex; align-items:center; gap:12px; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); }
  .topbar strong { font-size:16px; }
  .topbar .spacer { flex:1; }
  .tabs { display:flex; gap:4px; padding:8px 16px; background:var(--card); border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .tab-btn { border:none; background:transparent; padding:7px 12px; border-radius:8px; color:var(--muted); }
  .tab-btn.active { background:#eef4ff; color:var(--accent); font-weight:600; }
  main { padding:18px 20px 40px; max-width:1200px; width:100%; margin:0 auto; }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  .panel h2 { font-size:15px; margin:0 0 12px; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; }
  .row > .field { flex:1 1 160px; margin-bottom:0; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-size:12px; font-weight:500; }
  td .actions { display:flex; gap:4px; flex-wrap:wrap; }
  .pill { display:inline-block; padding:1px 7px; border-radius:999px; background:#f2f4f7; color:var(--muted); font-size:11px; }
  .pill.ok { background:#e8f7ee; color:#15803d; }
  .pill.warn { background:#fff7e6; color:#b45309; }
  .empty { color:var(--muted); padding:12px 0; }
  @media (max-width:720px) {
    .topbar { flex-wrap:wrap; }
    main { padding:12px; }
  }
</style>
</head>
<body>
<div id="login-view" class="login-wrap">
  <form id="login-form" class="login-card">
    <h1>cili-server 管理端</h1>
    <div class="field">
      <label>用户名</label>
      <input name="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label>密码</label>
      <input name="password" type="password" autocomplete="current-password" required>
    </div>
    <div id="login-error" class="error"></div>
    <button class="btn primary" type="submit" style="width:100%">登录</button>
  </form>
</div>

<div id="app-view" class="app" hidden>
  <header class="topbar">
    <strong>cili-server</strong>
    <span class="muted">组织管理</span>
    <span class="spacer"></span>
    <label class="muted" for="org-select">组织</label>
    <select id="org-select" style="padding:6px 8px;border:1px solid var(--line);border-radius:8px"></select>
    <span id="who" class="muted"></span>
    <button id="logout-btn" class="btn small">退出</button>
  </header>
  <nav class="tabs">
    <button class="tab-btn active" data-tab="people">人员</button>
    <button class="tab-btn" data-tab="groups">群组</button>
    <button class="tab-btn" data-tab="bundles">配置包</button>
    <button class="tab-btn" data-tab="repos">仓库</button>
    <button class="tab-btn" data-tab="devices">设备</button>
    <button class="tab-btn" data-tab="audit">审计</button>
  </nav>
  <main>
    <section id="tab-people" class="tab-panel">
      <div class="panel">
        <h2>新增人员</h2>
        <form id="person-form" class="row">
          <div class="field"><label>姓名</label><input name="name" required></div>
          <div class="field"><label>手机号</label><input name="phone" required></div>
          <div class="field"><label>备注</label><input name="note"></div>
          <button class="btn primary" type="submit">添加</button>
        </form>
        <div id="person-error" class="error"></div>
      </div>
      <div class="panel">
        <h2>人员列表</h2>
        <div id="people-list"></div>
      </div>
    </section>

    <section id="tab-groups" class="tab-panel" hidden>
      <div class="panel">
        <h2>新增群组</h2>
        <form id="group-form" class="row">
          <div class="field"><label>名称</label><input name="name" required></div>
          <div class="field"><label>备注</label><input name="note"></div>
          <button class="btn primary" type="submit">添加</button>
        </form>
        <div id="group-error" class="error"></div>
      </div>
      <div class="panel">
        <h2>群组列表</h2>
        <div id="groups-list"></div>
      </div>
    </section>

    <section id="tab-bundles" class="tab-panel" hidden>
      <div class="panel">
        <h2>新增配置包</h2>
        <form id="bundle-form">
          <div class="row">
            <div class="field"><label>名称</label><input name="name" required></div>
            <div class="field"><label>优先级</label><input name="priority" type="number" value="0"></div>
            <div class="field"><label>默认包</label><select name="is_default"><option value="">否</option><option value="1">是</option></select></div>
          </div>
          <div class="field"><label>model JSON（可空）</label><textarea name="model" placeholder='{"mode":"direct","provider_key":"org-acme",...}'></textarea></div>
          <div class="field"><label>workspaces JSON（可空）</label><textarea name="workspaces" placeholder='[{"key":"rd-shared","name":"研发部共享工作区","git":{...}}]'></textarea></div>
          <button class="btn primary" type="submit">添加</button>
        </form>
        <div id="bundle-error" class="error"></div>
      </div>
      <div class="panel">
        <h2>配置包列表</h2>
        <div id="bundles-list"></div>
      </div>
      <div class="panel">
        <h2>绑定关系</h2>
        <div id="bindings-list"></div>
      </div>
    </section>

    <section id="tab-repos" class="tab-panel" hidden>
      <div class="panel">
        <h2>新增共享仓库</h2>
        <form id="repo-form">
          <div class="row">
            <div class="field"><label>slug</label><input name="slug" placeholder="rd-shared" required></div>
            <div class="field"><label>名称</label><input name="name" required></div>
            <div class="field"><label>后端</label><select name="backend"><option value="local">local（本机裸仓库）</option><option value="forward">forward（上游 Git）</option></select></div>
            <div class="field"><label>授权群组 ID（逗号分隔）</label><input name="group_ids"></div>
          </div>
          <div class="row">
            <div class="field"><label>上游 URL（forward）</label><input name="upstream_url" placeholder="https://gitlab.example/team/repo.git"></div>
            <div class="field"><label>服务账号</label><input name="upstream_username"></div>
            <div class="field"><label>服务账号密码/Token</label><input name="upstream_password" type="password"></div>
          </div>
          <button class="btn primary" type="submit">创建仓库</button>
        </form>
        <div id="repo-error" class="error"></div>
      </div>
      <div class="panel">
        <h2>仓库列表</h2>
        <div id="repos-list"></div>
      </div>
    </section>

    <section id="tab-devices" class="tab-panel" hidden>
      <div class="panel">
        <h2>设备</h2>
        <div id="devices-list"></div>
      </div>
    </section>

    <section id="tab-audit" class="tab-panel" hidden>
      <div class="panel">
        <h2>审计日志</h2>
        <div id="audit-list"></div>
      </div>
    </section>
  </main>
</div>

<script>
(() => {
  'use strict';
  const state = { orgs: [], orgId: '', tab: 'people' };
  const $ = (id) => document.getElementById(id);

  function esc(value) {
    return String(value == null ? '' : value)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#39;');
  }

  async function api(path, options) {
    const opts = Object.assign({ credentials: 'same-origin' }, options || {});
    if (opts.body && typeof opts.body !== 'string') {
      opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
      opts.body = JSON.stringify(opts.body);
    }
    const res = await fetch(path, opts);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const error = new Error(data.error || data.detail || ('HTTP ' + res.status));
      error.status = res.status;
      throw error;
    }
    return data;
  }

  function showLogin() {
    $('app-view').hidden = true;
    $('login-view').hidden = false;
  }

  async function showApp() {
    $('login-view').hidden = true;
    $('app-view').hidden = false;
    const me = await api('/api/v1/admin/me');
    $('who').textContent = me.username;
    await loadOrgs();
  }

  async function loadOrgs() {
    const data = await api('/api/v1/admin/orgs');
    state.orgs = data.orgs || [];
    const select = $('org-select');
    select.innerHTML = state.orgs.map(
      (org) => `<option value="${esc(org.id)}">${esc(org.name)}</option>`
    ).join('');
    if (!state.orgs.length) {
      $('who').textContent = '（还没有组织，请先创建）';
      return;
    }
    state.orgId = select.value = state.orgs[0].id;
    await renderTab();
  }

  function qs() { return '?org_id=' + encodeURIComponent(state.orgId); }

  async function renderTab() {
    if (!state.orgId) return;
    if (state.tab === 'people') await renderPeople();
    if (state.tab === 'groups') await renderGroups();
    if (state.tab === 'bundles') await renderBundles();
    if (state.tab === 'repos') await renderRepos();
    if (state.tab === 'devices') await renderDevices();
    if (state.tab === 'audit') await renderAudit();
  }

  function table(headers, rows) {
    if (!rows.length) return '<div class="empty">暂无数据</div>';
    return '<table><thead><tr>' + headers.map((h) => `<th>${esc(h)}</th>`).join('')
      + '</tr></thead><tbody>' + rows.join('') + '</tbody></table>';
  }

  async function renderPeople() {
    const data = await api('/api/v1/admin/people' + qs());
    const rows = data.people.map((p) => `
      <tr>
        <td>${esc(p.name)}</td><td>${esc(p.phone)}</td>
        <td><span class="pill ${p.enabled ? 'ok' : 'warn'}">${p.enabled ? '启用' : '停用'}</span></td>
        <td>${esc(p.note)}</td>
        <td class="actions">
          <button class="btn small" data-person-toggle="${esc(p.id)}" data-enabled="${p.enabled ? '1' : '0'}">${p.enabled ? '停用' : '启用'}</button>
          <button class="btn small danger" data-person-delete="${esc(p.id)}">删除</button>
        </td>
      </tr>`);
    $('people-list').innerHTML = table(['姓名', '手机号', '状态', '备注', '操作'], rows);
  }

  async function renderGroups() {
    const data = await api('/api/v1/admin/groups' + qs());
    const rows = [];
    for (const group of data.groups) {
      const members = await api(`/api/v1/admin/groups/${encodeURIComponent(group.id)}/members`);
      const names = members.people.map((p) => `<span class="pill">${esc(p.name)}</span>`).join(' ');
      rows.push(`
        <tr>
          <td>${esc(group.name)}</td><td>${esc(group.note)}</td>
          <td>${names || '<span class="muted">无</span>'}</td>
          <td class="actions">
            <button class="btn small" data-group-member="${esc(group.id)}">加成员</button>
            <button class="btn small" data-group-delete="${esc(group.id)}">删除</button>
          </td>
        </tr>`);
    }
    $('groups-list').innerHTML = table(['名称', '备注', '成员', '操作'], rows);
  }

  async function renderBundles() {
    const data = await api('/api/v1/admin/bundles' + qs());
    const rows = data.bundles.map((b) => `
      <tr>
        <td>${esc(b.name)}</td><td>${b.priority}</td>
        <td>${b.is_default ? '是' : '否'}</td>
        <td><span class="muted">${b.model ? '有 model' : '无 model'} · ${(b.workspaces || []).length} 个工作区</span></td>
        <td class="actions">
          <button class="btn small" data-bundle-bind="${esc(b.id)}">绑定</button>
          <button class="btn small danger" data-bundle-delete="${esc(b.id)}">删除</button>
        </td>
      </tr>`);
    $('bundles-list').innerHTML = table(['名称', '优先级', '默认', '内容', '操作'], rows);

    const bindings = await api('/api/v1/admin/bindings' + qs());
    const bindingRows = bindings.bindings.map((b) => `
      <tr>
        <td>${esc(b.bundle_name)}</td>
        <td>${esc(b.target_type)}</td>
        <td>${esc(b.target_id)}</td>
        <td>${b.priority}</td>
        <td class="actions"><button class="btn small danger" data-binding-delete="${esc(b.id)}">解绑</button></td>
      </tr>`);
    $('bindings-list').innerHTML = table(['配置包', '目标类型', '目标 ID', '优先级', '操作'], bindingRows);
  }

  async function renderRepos() {
    const data = await api('/api/v1/admin/repos' + qs());
    const rows = data.repos.map((repo) => `
      <tr>
        <td>${esc(repo.slug)}</td><td>${esc(repo.name)}</td>
        <td>${esc(repo.backend)}</td><td>${esc(repo.created_at)}</td>
        <td class="actions">
          <button class="btn small" data-repo-acl="${esc(repo.id)}">授权群组</button>
          <button class="btn small danger" data-repo-delete="${esc(repo.id)}">删除</button>
        </td>
      </tr>`);
    $('repos-list').innerHTML = table(['slug', '名称', '后端', '创建时间', '操作'], rows);
  }

  async function renderDevices() {
    const data = await api('/api/v1/admin/devices' + qs());
    const rows = data.devices.map((d) => `
      <tr>
        <td>${esc(d.person_name)}</td><td>${esc(d.phone)}</td><td>${esc(d.name)}</td>
        <td>${esc(d.last_seen_at)}</td><td>${esc(d.expires_at)}</td>
        <td><span class="pill ${d.revoked ? 'warn' : 'ok'}">${d.revoked ? '已吊销' : '有效'}</span></td>
        <td class="actions"><button class="btn small danger" data-device-revoke="${esc(d.id)}">吊销</button></td>
      </tr>`);
    $('devices-list').innerHTML = table(['人员', '手机号', '设备', '最近使用', '到期', '状态', '操作'], rows);
  }

  async function renderAudit() {
    const data = await api('/api/v1/admin/audit' + qs() + '&limit=100');
    const rows = data.entries.map((e) => `
      <tr>
        <td>${esc(e.at)}</td><td>${esc(e.actor)}</td><td>${esc(e.action)}</td>
        <td>${esc(e.target)}</td><td>${esc(e.detail)}</td><td>${esc(e.ip)}</td>
      </tr>`);
    $('audit-list').innerHTML = table(['时间', '操作者', '动作', '目标', '详情', 'IP'], rows);
  }

  function bindForms() {
    $('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('login-error').textContent = '';
      const form = new FormData(event.target);
      try {
        await api('/api/v1/admin/login', {
          method: 'POST',
          body: { username: form.get('username'), password: form.get('password') },
        });
        await showApp();
      } catch (error) {
        $('login-error').textContent = error.message;
      }
    });

    $('logout-btn').addEventListener('click', async () => {
      try { await api('/api/v1/admin/logout', { method: 'POST' }); } catch (error) { /* ignore */ }
      showLogin();
    });

    $('org-select').addEventListener('change', async (event) => {
      state.orgId = event.target.value;
      await renderTab();
    });

    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        state.tab = btn.dataset.tab;
        document.querySelectorAll('.tab-panel').forEach((panel) => {
          panel.hidden = panel.id !== 'tab-' + state.tab;
        });
        await renderTab();
      });
    });

    $('person-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('person-error').textContent = '';
      const form = new FormData(event.target);
      try {
        await api('/api/v1/admin/people', {
          method: 'POST',
          body: { org_id: state.orgId, name: form.get('name'), phone: form.get('phone'), note: form.get('note') },
        });
        event.target.reset();
        await renderPeople();
      } catch (error) { $('person-error').textContent = error.message; }
    });

    $('group-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('group-error').textContent = '';
      const form = new FormData(event.target);
      try {
        await api('/api/v1/admin/groups', {
          method: 'POST',
          body: { org_id: state.orgId, name: form.get('name'), note: form.get('note') },
        });
        event.target.reset();
        await renderGroups();
      } catch (error) { $('group-error').textContent = error.message; }
    });

    $('bundle-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('bundle-error').textContent = '';
      const form = new FormData(event.target);
      let model = null;
      let workspaces = [];
      try {
        model = String(form.get('model') || '').trim() ? JSON.parse(form.get('model')) : null;
        workspaces = String(form.get('workspaces') || '').trim() ? JSON.parse(form.get('workspaces')) : [];
      } catch (error) {
        $('bundle-error').textContent = 'JSON 格式错误';
        return;
      }
      try {
        await api('/api/v1/admin/bundles', {
          method: 'POST',
          body: {
            org_id: state.orgId,
            name: form.get('name'),
            priority: Number(form.get('priority') || 0),
            is_default: form.get('is_default') === '1',
            model,
            workspaces,
          },
        });
        event.target.reset();
        await renderBundles();
      } catch (error) { $('bundle-error').textContent = error.message; }
    });

    $('repo-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      $('repo-error').textContent = '';
      const form = new FormData(event.target);
      const groupIds = String(form.get('group_ids') || '').split(',').map((x) => x.trim()).filter(Boolean);
      try {
        await api('/api/v1/admin/repos', {
          method: 'POST',
          body: {
            org_id: state.orgId,
            slug: form.get('slug'),
            name: form.get('name'),
            group_ids: groupIds,
            backend: form.get('backend') || 'local',
            upstream_url: form.get('upstream_url') || '',
            upstream_username: form.get('upstream_username') || '',
            upstream_password: form.get('upstream_password') || '',
          },
        });
        event.target.reset();
        await renderRepos();
      } catch (error) { $('repo-error').textContent = error.message; }
    });

    document.addEventListener('click', async (event) => {
      const target = event.target.closest('button');
      if (!target) return;
      try {
        if (target.dataset.personToggle) {
          await api(`/api/v1/admin/people/${encodeURIComponent(target.dataset.personToggle)}`, {
            method: 'PATCH',
            body: { enabled: target.dataset.enabled !== '1' },
          });
          await renderPeople();
        } else if (target.dataset.personDelete) {
          if (!confirm('删除该人员？')) return;
          await api(`/api/v1/admin/people/${encodeURIComponent(target.dataset.personDelete)}`, { method: 'DELETE' });
          await renderPeople();
        } else if (target.dataset.groupDelete) {
          if (!confirm('删除该群组？')) return;
          await api(`/api/v1/admin/groups/${encodeURIComponent(target.dataset.groupDelete)}`, { method: 'DELETE' });
          await renderGroups();
        } else if (target.dataset.groupMember) {
          const personId = prompt('人员 ID');
          if (!personId) return;
          await api(`/api/v1/admin/groups/${encodeURIComponent(target.dataset.groupMember)}/members`, {
            method: 'POST', body: { person_id: personId.trim() },
          });
          await renderGroups();
        } else if (target.dataset.bundleBind) {
          const targetType = prompt('绑定到 group 还是 person？', 'group');
          if (!targetType) return;
          const targetId = prompt('目标 ID');
          if (!targetId) return;
          await api(`/api/v1/admin/bundles/${encodeURIComponent(target.dataset.bundleBind)}/bind`, {
            method: 'POST', body: { target_type: targetType.trim(), target_id: targetId.trim() },
          });
          await renderBundles();
        } else if (target.dataset.bundleDelete) {
          if (!confirm('删除该配置包？')) return;
          await api(`/api/v1/admin/bundles/${encodeURIComponent(target.dataset.bundleDelete)}`, { method: 'DELETE' });
          await renderBundles();
        } else if (target.dataset.bindingDelete) {
          await api(`/api/v1/admin/bindings/${encodeURIComponent(target.dataset.bindingDelete)}`, { method: 'DELETE' });
          await renderBundles();
        } else if (target.dataset.repoDelete) {
          if (!confirm('删除仓库及裸仓库目录？')) return;
          await api(`/api/v1/admin/repos/${encodeURIComponent(target.dataset.repoDelete)}`, { method: 'DELETE' });
          await renderRepos();
        } else if (target.dataset.repoAcl) {
          const groupId = prompt('群组 ID');
          if (!groupId) return;
          await api(`/api/v1/admin/repos/${encodeURIComponent(target.dataset.repoAcl)}/groups`, {
            method: 'POST', body: { group_id: groupId.trim(), can_write: true },
          });
          alert('已授权');
        } else if (target.dataset.deviceRevoke) {
          if (!confirm('吊销该设备令牌？')) return;
          await api(`/api/v1/admin/devices/${encodeURIComponent(target.dataset.deviceRevoke)}/revoke`, { method: 'POST' });
          await renderDevices();
        }
      } catch (error) {
        alert(error.message);
      }
    });
  }

  async function boot() {
    bindForms();
    try {
      await showApp();
    } catch (error) {
      showLogin();
    }
  }

  boot();
})();
</script>
</body>
</html>
